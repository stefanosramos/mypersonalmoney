version: "3.9"

services:

  db:
    image: postgres:16
    container_name: mypersonalmoney-postgres
    environment:
      POSTGRES_DB: mypersonalmoney
      POSTGRES_USER: mymoney
      POSTGRES_PASSWORD: 123456
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: mypersonalmoney-app
    environment:
      DB_URL: jdbc:postgresql://db:5432/mypersonalmoney
      DB_USER: mymoney
      DB_PASS: 123456
    depends_on:
      - db
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: mypersonalmoney-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata: