<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MyPersonalMoney</title>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fafafa; }
        header { padding: 16px 20px; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; }
        h1 { margin: 0; font-size: 18px; }
        .wrap { padding: 16px 20px; }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
        .card { background: white; border: 1px solid #eee; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
        .row { display:flex; justify-content:space-between; gap:12px; align-items: baseline; }
        .muted { color:#666; font-size: 12px; }
        .balance { font-weight: 700; font-size: 22px; }
        .badge { font-size: 12px; padding: 3px 8px; border-radius: 999px; background:#f1f1f1; }
        .form { margin-top: 12px; display:grid; gap: 8px; }
        .form input, .form select { width:100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #fff; }
        .actions { display:flex; gap: 8px; }
        .btn { flex:1; padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #111; color: white; cursor:pointer; }
        .btn.secondary { background: white; color:#111; }
        .disabled { opacity:.55; }
    </style>
</head>

<body>
<header>
    <h1>Contas</h1>
    <div class="muted">V1 — cards com saldo e lançamento rápido</div>
    <a href="/admin" class="muted">Admin</a>
</header>
<div class="card" style="margin-bottom:16px;">
    <div class="row">
        <div>
            <div style="font-weight:700">Saldo consolidado</div>
            <div class="muted">Soma de todas as contas ativas</div>
        </div>
        <div style="text-align:right">
            <div class="balance"
                 style="color:{#if consolidatedBalance < 0}#b00020{#else}inherit{/if}">
                {consolidatedBalanceFormatted}
            </div>
        </div>
    </div>
</div>
<div class="card" style="margin-bottom:16px;">
    <div class="row">
        <div style="font-weight:700">Transferência entre contas</div>
        <div class="muted">Movimentação interna (não é receita nem despesa)</div>
    </div>

    <form class="form" method="post" action="/ui/transfer">

        <select id="transfer-from" name="fromAccountId" required onchange="syncTransferSelects()">
            <option value="">Conta origem</option>
            {#for acc in transferAccounts}
            <option value="{acc.id}">{acc.name}</option>
            {/for}
        </select>

        <select id="transfer-to" name="toAccountId" required onchange="syncTransferSelects()">
            <option value="">Conta destino</option>
            {#for acc in transferAccounts}
            <option value="{acc.id}">{acc.name}</option>
            {/for}
        </select>

        <input name="amount"
               inputmode="decimal"
               placeholder="Valor (ex: 150,00)"
               required />

        <input name="date"
               type="date"
               value="{today}" />

        <input name="description"
               placeholder="Descrição (ex: Transferência Itaú → Nubank)" />

        <button class="btn" type="submit">
            Transferir
        </button>

    </form>
</div>
<div class="wrap">
    <div class="grid">
        {#for a in accounts}
        {#include ui/account_card.html a=a /}
        {/for}
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
