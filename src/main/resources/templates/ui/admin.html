<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin - MyPersonalMoney</title>

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; background: #fafafa; }
        header { padding: 16px 20px; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
        h1 { margin: 0; font-size: 18px; }
        a { color: #111; text-decoration: none; }
        .wrap { padding: 16px 20px; display: grid; gap: 16px; }
        .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
        .card { background: white; border: 1px solid #eee; border-radius: 14px; padding: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
        .muted { color:#666; font-size: 12px; }
        .row { display:flex; justify-content:space-between; gap:12px; align-items:baseline; }
        .form { margin-top: 12px; display:grid; gap: 8px; }
        .form input, .form select { width:100%; padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #fff; }
        .btn { padding: 10px; border-radius: 10px; border: 1px solid #ddd; background: #111; color: white; cursor:pointer; }
        table { width:100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align:left; padding: 8px; border-bottom: 1px solid #eee; font-size: 13px; }
        .badge { font-size: 12px; padding: 3px 8px; border-radius: 999px; background:#f1f1f1; }
    </style>
</head>

<body>
<header>
    <div>
        <h1>Administração</h1>
        <div class="muted">Cadastros (contas, categorias, subcategorias)</div>
    </div>
    <div class="muted">
        <a href="/">← Voltar</a>
    </div>
</header>

<div class="wrap">
    <div class="grid">
        <div class="card" id="admin-accounts">
            {#include ui/admin_accounts.html accounts=accounts accountTypes=accountTypes /}
        </div>

        <div class="card" id="admin-categories">
            {#include ui/admin_categories.html categories=categories categoryTypes=categoryTypes subcategories=subcategories /}
        </div>
    </div>
</div>
</body>
</html>
