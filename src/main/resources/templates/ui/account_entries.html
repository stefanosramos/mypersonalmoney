<table>
    <thead>
    <tr>
        <th>Data</th>
        <th>Descrição</th>
        <th>Categoria</th>
        <th class="right">Valor</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    {#for e in entries}
    <tr>
        <td>{e.date}</td>
        <td>{e.description}</td>
        <td>
            {#if e.categoryName}{e.categoryName}{#else}<span class="muted">(sem)</span>{/if}
            {#if e.subCategoryName} / {e.subCategoryName}{/if}
        </td>

        <td class="right" style="font-weight:700">
            {#if e.direction == 'DEBIT'}
            <span style="color:#b00020">- {e.amountFormatted}</span>
            {#else}
            <span style="color:#0a7a2f">+ {e.amountFormatted}</span>
            {/if}
        </td>

        <td class="right">
            <form method="post"
                  action="/accounts/{accountId}/txns/{e.txnId}/delete"
                  onsubmit="return confirm('Excluir este lançamento?');"
                  style="display:inline">
                <input type="hidden" name="range" value="{range}">
                <button type="submit" title="Excluir"
                        style="border:0;background:transparent;cursor:pointer;font-size:16px">
                    🗑️
                </button>
            </form>
        </td>
    </tr>
    {/for}
    </tbody>
</table>
