<div class="card" id="acc-{a.id}">
    <div class="row">
        <div>
            <div style="font-weight:700">
                <a href="/accounts/{a.id}" style="color:#111; text-decoration:none">{a.name}</a>
            </div>
            <div class="muted">{a.type} {#if !a.active}<span class="badge">inativa</span>{/if}</div>
        </div>
        <div style="text-align:right">
            <div class="muted">Saldo</div>
            <div class="balance"
                 style="color:{#if a.balance < 0}#b00020{#else}inherit{/if}">
                {a.balanceFormatted}
            </div>
        </div>
    </div>

    {#if a.active}
    <form class="form"
          hx-post="/ui/accounts/{a.id}/posting"
          hx-target="#acc-{a.id}"
          hx-swap="outerHTML">

        <input name="description" placeholder="Descrição (ex: Supermercado)" />

        <input name="amount"
               inputmode="decimal"
               placeholder="Valor (ex: 50,50)"
               required />

        <input name="date" type="date" value="{today}" />

        <select id="cat-{a.id}"
                name="categoryId"
                hx-get="/ui/subcategories/options"
                hx-trigger="change"
                hx-target="#subcat-{a.id}"
                hx-include="#cat-{a.id}"
                hx-swap="innerHTML"
                required>
            <option value="">(selecione uma categoria)</option>

            <optgroup label="Receitas">
                {#for c in categories}
                {#if c.type.toString == 'INCOME'}
                <option value="{c.id}">{c.name}</option>
                {/if}
                {/for}
            </optgroup>

            <optgroup label="Despesas">
                {#for c in categories}
                {#if c.type.toString == 'EXPENSE'}
                <option value="{c.id}">{c.name}</option>
                {/if}
                {/for}
            </optgroup>
        </select>

        <select id="subcat-{a.id}" name="subCategoryId">
            <option value="">(sem subcategoria)</option>
        </select>

        <button class="btn" type="submit">Lançar</button>
    </form>
    {#else}
    <div class="muted disabled" style="margin-top:12px">Conta inativa</div>
    {/if}
</div>
